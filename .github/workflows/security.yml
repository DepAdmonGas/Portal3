name: Security

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  php-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:stable
      - name: PHP syntax
        run: find app public tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l

  security-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:stable
      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Report independent API contract parity status
        run: |
          echo "CROSS_REPOSITORY_PARITY: NOT_VERIFIED"
          echo "This isolated Portal3 runner does not check out the API repository."
          echo "Run CHECADOR_API_CONTRACT_REPO=/path/to/authorized/portal-api php tests/checador_contract_parity.php separately."
      - name: Security regression suite
        env:
          APP_ENV: testing
          APP_TIMEZONE: UTC
        run: php tests/run_security_suite.php

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:stable
      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Composer audit
        run: composer audit --locked
